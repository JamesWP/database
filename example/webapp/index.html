<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>database.wasm demo</title>
  <style>
    body { font-family: monospace; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.2rem; }
    .sql { color: #555; margin: 0.5rem 0 0.2rem; }
    .sql::before { content: '> '; color: #aaa; }
    table { border-collapse: collapse; margin: 0.5rem 0 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.25rem 0.75rem; text-align: left; }
    th { background: #f5f5f5; }
    .ok { color: #080; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>database.wasm</h1>
  <div id="output">Loading…</div>

  <script type="module">
    import init, { Database } from '../../pkg/database.js';

    function log(html) {
      document.getElementById('output').insertAdjacentHTML('beforeend', html);
    }

    function exec(db, sql) {
      log(`<div class="sql">${sql}</div>`);
      const result = db.execute(sql);
      log(`<div class="ok">${result}</div>`);
    }

    function query(db, sql) {
      log(`<div class="sql">${sql}</div>`);
      const rows = db.query(sql);
      if (!rows.length) { log(`<div>(no rows)</div>`); return; }
      const cols = rows[0].length;
      let html = '<table><tbody>';
      for (const row of rows) {
        html += '<tr>' + Array.from(row).map(v => `<td>${v}</td>`).join('') + '</tr>';
      }
      html += '</tbody></table>';
      log(html);
    }

    await init();
    document.getElementById('output').innerHTML = '';

    const db = new Database();

    exec(db, "CREATE TABLE users (id INTEGER, name TEXT, age INTEGER)");
    exec(db, "INSERT INTO users VALUES (1, 'alice', 30)");
    exec(db, "INSERT INTO users VALUES (2, 'bob', 25)");
    exec(db, "INSERT INTO users VALUES (3, 'carol', 35)");

    exec(db, "CREATE TABLE orders (id INTEGER, user_id INTEGER, item TEXT)");
    exec(db, "INSERT INTO orders VALUES (1, 1, 'laptop')");
    exec(db, "INSERT INTO orders VALUES (2, 2, 'keyboard')");
    exec(db, "INSERT INTO orders VALUES (3, 1, 'mouse')");

    query(db, "SELECT * FROM users");
    query(db, "SELECT * FROM users WHERE age > 26");
    query(db, "SELECT * FROM orders WHERE user_id = 1");

    // Custom JS storage provider demo
    log('<hr><h2>Custom storage provider</h2>');
    const provider = {
      _pages: new Map(),
      pageCount()        { return this._pages.size; },
      setPageCount(n)    {
        while (this._pages.size < n) this._pages.set(this._pages.size, new Uint8Array(4096));
        while (this._pages.size > n) this._pages.delete(this._pages.size - 1);
      },
      readPage(n)        { return this._pages.get(n) ?? new Uint8Array(4096); },
      writePage(n, data) { this._pages.set(n, data.slice()); },
      flush()            {},
    };

    const db2 = Database.withStorage(provider);
    exec(db2, "CREATE TABLE custom (val INTEGER)");
    exec(db2, "INSERT INTO custom VALUES (7)");
    exec(db2, "INSERT INTO custom VALUES (42)");
    query(db2, "SELECT val FROM custom");
    log(`<div class="ok">provider holds ${provider._pages.size} pages</div>`);
  </script>
</body>
</html>
